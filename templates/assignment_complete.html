<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Already completed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e1e1e, #2d2d30);
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: linear-gradient(135deg, #252526, #2d2d30);
            border: 2px solid #404040;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: #22c55e;
        }
        p {
            line-height: 1.6;
            color: #a3a3a3;
            margin-bottom: 24px;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        a:hover { opacity: 0.92; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="headline">You have already completed this activity</h1>
        <p id="detail">Your responses and submission were recorded. You can close this window or return to the login page.</p>
        <a href="/home.html">Back to login</a>
    </div>
    <script>
        (function () {
            var q = new URLSearchParams(window.location.search);
            var kind = (q.get('kind') || 'assignment').toLowerCase();
            var h = document.getElementById('headline');
            var d = document.getElementById('detail');
            if (kind === 'quiz') {
                h.textContent = 'You have already completed this quiz';
                d.textContent = 'Your submission was recorded. If you need to retake it, contact your instructor.';
            }
        })();
    </script>
</body>
</html>
