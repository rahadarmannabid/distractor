<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey - AI Code Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Menlo', 'Ubuntu Mono', monospace;
            background: linear-gradient(135deg, #1e1e1e, #2d2d30, #3e3e42);
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Animated background elements */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .bg-animation::before,
        .bg-animation::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .bg-animation::before {
            background: linear-gradient(135deg, #f97316, #ea580c);
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .bg-animation::after {
            background: linear-gradient(135deg, #569cd6, #4a86c7);
            bottom: 20%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.1);
            }
        }

        .survey-container {
            background: linear-gradient(135deg, #252526, #2d2d30);
            border: 2px solid #404040;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .survey-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f97316, #ea580c, #569cd6, #4a86c7);
            background-size: 200% 100%;
            animation: gradient-shift 3s ease infinite;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Dark scrollbar */
        .survey-container::-webkit-scrollbar {
            width: 8px;
        }

        .survey-container::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 4px;
        }

        .survey-container::-webkit-scrollbar-thumb {
            background: #569cd6;
            border-radius: 4px;
        }

        .survey-container::-webkit-scrollbar-thumb:hover {
            background: #4a86c7;
        }

        .survey-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .survey-header h1 {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #f97316, #ea580c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .survey-header p {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.5;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(64, 64, 64, 0.5);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid #404040;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f97316, #ea580c, #569cd6);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        .question {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(64, 64, 64, 0.2);
            border: 1px solid #404040;
            border-radius: 8px;
            border-left: 4px solid #569cd6;
            transition: all 0.3s ease;
        }

        .question:hover {
            background: rgba(64, 64, 64, 0.3);
            border-left-color: #f97316;
        }

        .question-label {
            display: block;
            color: #d4d4d4;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .required {
            color: #ef4444;
        }

        /* Likert Scale */
        .likert-scale {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .likert-option {
            flex: 1;
            text-align: center;
        }

        .likert-option input[type="radio"] {
            display: none;
        }

        .likert-option label {
            display: block;
            padding: 15px 10px;
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            border: 2px solid #404040;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            color: #cccccc;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .likert-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border-color: #f97316;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        .likert-option label:hover {
            border-color: #569cd6;
            transform: translateY(-2px);
        }

        .likert-option label strong {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .likert-option label small {
            font-size: 10px;
            opacity: 0.8;
        }

        /* Text Input */
        .text-input {
            width: 100%;
            padding: 12px;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #404040;
            border-radius: 8px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.3);
            background: rgba(30, 30, 30, 0.95);
        }

        .text-input::placeholder {
            color: #6c6c6c;
            font-style: italic;
        }

        /* Multiple Choice */
        .multiple-choice {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-option {
            display: flex;
            align-items: center;
            padding: 12px;
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            border: 2px solid #404040;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-option:has(input:checked) {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
        }

        .choice-option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
            accent-color: #f97316;
        }

        .choice-option label {
            cursor: pointer;
            flex: 1;
            color: #d4d4d4;
            font-size: 14px;
        }

        .choice-option:hover {
            border-color: #569cd6;
            transform: translateX(5px);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 16px 40px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #ea580c, #dc2626);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #404040;
        }

        .btn-primary:disabled::before {
            display: none;
        }

        .error-message {
            color: #ef4444;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            padding: 15px;
            background: linear-gradient(135deg, #2d1b1b, #3d2222);
            border: 2px solid #ef4444;
            border-radius: 8px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #cccccc;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-radius: 50%;
            border-top-color: #f97316;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .survey-container {
                padding: 25px 20px;
            }

            .survey-header h1 {
                font-size: 22px;
            }

            .likert-scale {
                flex-direction: column;
            }

            .likert-option label {
                padding: 12px;
                min-height: 50px;
            }

            .btn {
                padding: 12px 30px;
                font-size: 14px;
            }
        }

        /* Info section at bottom */
        .info-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #404040;
            text-align: center;
        }

        .info-text {
            color: #888;
            font-size: 12px;
            line-height: 1.4;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="survey-container">
        <div class="survey-header">
            <h1 id="surveyTitle">Loading Survey...</h1>
            <p id="surveyDescription"></p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="surveyContent" class="loading">
            <div class="spinner"></div>
            <p>Loading survey questions...</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="button-group" id="buttonGroup" style="display: none;">
            <button class="btn btn-primary" id="submitBtn">Submit Survey</button>
        </div>

        <div class="info-section" style="display: none;" id="infoSection">
            <div class="info-text">
                All questions must be completed to submit the survey. Your responses are securely stored and used for research purposes only.
            </div>
            <div class="security-badge">
                🔒 Secure Research Survey
            </div>
        </div>
    </div>

    <script>
        // Survey Manager - ALL JavaScript INLINE
        class SurveyManager {
            constructor() {
                this.surveyType = new URLSearchParams(window.location.search).get('type');
                
                // Get auth data from sessionStorage
                const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                this.sessionId = authData.sessionId;
                this.userId = authData.userId;
                this.assignmentKey = authData.assignmentKey;
                
                this.surveyConfig = null;
                this.responses = {};
                this.startTime = Date.now();
                
                if (!this.sessionId || !this.userId || !this.assignmentKey) {
                    this.showError('Session expired. Please log in again.');
                    setTimeout(() => window.location.href = '/home.html', 2000);
                    return;
                }
                
                this.init();
            }

            async init() {
                try {
                    await this.loadSurveyConfig();
                    await this.updateSurveyStatus('in_progress');
                    this.renderSurvey();
                    this.setupEventListeners();
                    document.getElementById('infoSection').style.display = 'block';
                } catch (error) {
                    console.error('Survey initialization error:', error);
                    this.showError('Failed to load survey. Please try again.');
                }
            }

            async loadSurveyConfig() {
                const response = await fetch(`/survey-config/${this.assignmentKey}`);
                if (!response.ok) throw new Error('Failed to load survey config');
                
                const config = await response.json();
                
                if (this.surveyType === 'pre') {
                    this.surveyConfig = config.pre_survey;
                } else if (this.surveyType === 'post') {
                    this.surveyConfig = config.post_survey;
                } else {
                    throw new Error('Invalid survey type');
                }

                // Update header - add mandatory message
                document.getElementById('surveyTitle').textContent = this.surveyConfig.title || `${this.surveyType.toUpperCase()} Survey`;
                const descriptionText = this.surveyConfig.description || '';
                document.getElementById('surveyDescription').textContent = descriptionText + (descriptionText ? ' ' : '') + 'All questions are mandatory.';
            }

            renderSurvey() {
                const content = document.getElementById('surveyContent');
                content.className = '';
                content.innerHTML = '';

                this.surveyConfig.questions.forEach((question, index) => {
                    const questionDiv = this.createQuestionElement(question, index);
                    content.appendChild(questionDiv);
                });

                document.getElementById('buttonGroup').style.display = 'flex';
                // Disable submit button initially - will be enabled when all questions answered
                document.getElementById('submitBtn').disabled = true;
                this.updateProgress();
            }

            createQuestionElement(question, index) {
                const div = document.createElement('div');
                div.className = 'question';
                div.dataset.questionId = question.id;

                const label = document.createElement('label');
                label.className = 'question-label';
                // ALL questions are mandatory - always show red asterisk
                label.innerHTML = `${index + 1}. ${question.question} <span class="required">*</span>`;
                div.appendChild(label);

                if (question.type === 'likert') {
                    div.appendChild(this.createLikertScale(question));
                } else if (question.type === 'multiple_choice') {
                    div.appendChild(this.createMultipleChoice(question));
                } else if (question.type === 'open_ended') {
                    div.appendChild(this.createOpenEnded(question));
                }

                return div;
            }

            createLikertScale(question) {
                const container = document.createElement('div');
                container.className = 'likert-scale';

                const scale = question.scale || {
                    min: 1,
                    max: 5,
                    minLabel: 'Strongly Disagree',
                    maxLabel: 'Strongly Agree'
                };

                for (let i = scale.min; i <= scale.max; i++) {
                    const option = document.createElement('div');
                    option.className = 'likert-option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = question.id;
                    input.value = i;
                    input.id = `${question.id}_${i}`;
                    input.addEventListener('change', () => this.handleResponse(question.id, i));

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    
                    if (i === scale.min) {
                        label.innerHTML = `<strong>${i}</strong><br><small>${scale.minLabel}</small>`;
                    } else if (i === scale.max) {
                        label.innerHTML = `<strong>${i}</strong><br><small>${scale.maxLabel}</small>`;
                    } else {
                        label.innerHTML = `<strong>${i}</strong>`;
                    }

                    option.appendChild(input);
                    option.appendChild(label);
                    container.appendChild(option);
                }

                return container;
            }

            createMultipleChoice(question) {
                const container = document.createElement('div');
                container.className = 'multiple-choice';

                question.options.forEach((option, index) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'choice-option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = question.id;
                    input.value = option;
                    input.id = `${question.id}_${index}`;
                    input.addEventListener('change', () => this.handleResponse(question.id, option));

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    label.textContent = option;

                    optionDiv.appendChild(input);
                    optionDiv.appendChild(label);
                    
                    // Make entire div clickable
                    optionDiv.addEventListener('click', (e) => {
                        if (e.target !== input) {
                            input.checked = true;
                            this.handleResponse(question.id, option);
                        }
                    });
                    
                    container.appendChild(optionDiv);
                });

                return container;
            }

            createOpenEnded(question) {
                const textarea = document.createElement('textarea');
                textarea.className = 'text-input';
                textarea.placeholder = question.placeholder || 'Enter your response here...';
                textarea.maxLength = question.max_length || 1000;
                textarea.addEventListener('input', (e) => {
                    const value = e.target.value.trim();
                    // Only count as answered if there's actual content
                    if (value.length > 0) {
                        this.handleResponse(question.id, value);
                    } else {
                        // Remove from responses if empty
                        delete this.responses[question.id];
                        this.updateProgress();
                    }
                });

                return textarea;
            }

            handleResponse(questionId, answer) {
                this.responses[questionId] = answer;
                this.updateProgress();
            }

            updateProgress() {
                const totalQuestions = this.surveyConfig.questions.length;
                const answeredQuestions = Object.keys(this.responses).length;
                const progress = (answeredQuestions / totalQuestions) * 100;

                document.getElementById('progressFill').style.width = `${progress}%`;
                
                // Enable submit button only when ALL questions are answered
                const submitBtn = document.getElementById('submitBtn');
                if (submitBtn) {
                    submitBtn.disabled = answeredQuestions < totalQuestions;
                }
            }

            async updateSurveyStatus(status) {
                try {
                    const response = await fetch(`/update-survey-status?session_id=${this.sessionId}&survey_type=${this.surveyType}&status=${status}`, {
                        method: 'POST'
                    });
                    if (!response.ok) throw new Error('Failed to update status');
                } catch (error) {
                    console.error('Status update error:', error);
                }
            }

            setupEventListeners() {
                document.getElementById('submitBtn').addEventListener('click', () => this.submitSurvey());

                // Prevent accidental navigation
                window.addEventListener('beforeunload', (e) => {
                    if (Object.keys(this.responses).length > 0) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });
            }

            async submitSurvey() {
                // Validate ALL questions are answered (all questions are mandatory)
                const totalQuestions = this.surveyConfig.questions.length;
                const answeredQuestions = Object.keys(this.responses).length;
                const unansweredCount = totalQuestions - answeredQuestions;

                if (unansweredCount > 0) {
                    this.showError(`Please answer all questions (${unansweredCount} remaining). All questions are required.`);
                    return;
                }

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting...';

                try {
                    const completionTime = (Date.now() - this.startTime) / 1000;

                    const submission = {
                        user_id: this.userId,
                        session_id: this.sessionId,
                        assignment_key: this.assignmentKey,
                        survey_type: this.surveyType,
                        survey_title: this.surveyConfig.title,
                        survey_description: this.surveyConfig.description,
                        questions: this.surveyConfig.questions,
                        responses: this.surveyConfig.questions.map(q => ({
                            question_id: q.id,
                            question_text: q.question,
                            question_type: q.type,
                            question_config: {
                                scale: q.scale,
                                options: q.options,
                                placeholder: q.placeholder,
                                max_length: q.max_length
                            },
                            answer: this.responses[q.id] || null,
                            required: true  // All questions are now mandatory
                        })),
                        timestamp: new Date().toISOString(),
                        total_questions: this.surveyConfig.questions.length,
                        required_questions: this.surveyConfig.questions.length,  // All questions are required
                        completion_time_seconds: completionTime
                    };

                    const response = await fetch('/submit-pre-post-survey', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(submission)
                    });

                    if (!response.ok) throw new Error('Submission failed');

                    await this.updateSurveyStatus('completed');

                    // Get auth data for redirect
                    const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                    const sessionToken = authData.sessionToken;
                    const userId = authData.userId;

                    // ===== Handle Pre-Survey and Post-Survey Differently =====
                    if (this.surveyType === 'pre') {
                        submitBtn.textContent = 'Downloading Assignment...';
                        
                        try {
                            // Trigger PDF download
                            const downloadUrl = `/download-assignment/${this.assignmentKey}`;
                            const link = document.createElement('a');
                            link.href = downloadUrl;
                            link.download = `${this.assignmentKey}.pdf`;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            
                            // Show success message
                            submitBtn.textContent = 'Download Started!';
                            await new Promise(resolve => setTimeout(resolve, 1500));
                            
                        } catch (downloadError) {
                            console.error('PDF download error:', downloadError);
                            // Continue to IDE even if download fails
                            this.showError('Assignment download failed, but you can continue to the IDE', 'warning');
                            await new Promise(resolve => setTimeout(resolve, 2000));
                        }
                        
                        // Redirect to IDE after pre-survey
                        window.location.href = `/index.html?session=${sessionToken}&user=${encodeURIComponent(userId)}`;
                        
                    } else if (this.surveyType === 'post') {
                        // Post-survey complete - check if we came from submission flow
                        const isSubmissionPending = sessionStorage.getItem('postSurveySubmissionPending') === 'true';
                        
                        if (isSubmissionPending) {
                            // Clear the flag
                            sessionStorage.removeItem('postSurveySubmissionPending');
                            
                            // Show success message
                            submitBtn.textContent = 'Post-Survey Complete!';
                            this.showError('Survey completed! Returning to IDE to submit your code...', 'success');
                            
                            await new Promise(resolve => setTimeout(resolve, 2000));
                            
                            // Redirect back to IDE with flag to trigger submission
                            window.location.href = `/index.html?session=${sessionToken}&user=${encodeURIComponent(userId)}&submit_code=true`;
                        } else {
                            // Post-survey completed outside submission flow (shouldn't happen normally)
                            window.location.href = `/index.html?session=${sessionToken}&user=${encodeURIComponent(userId)}`;
                        }
                    }

                } catch (error) {
                    console.error('Submission error:', error);
                    this.showError('Failed to submit survey. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Survey';
                }
            }

            showError(message) {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                setTimeout(() => errorDiv.style.display = 'none', 5000);
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new SurveyManager();
        });
    </script>
</body>
</html>
