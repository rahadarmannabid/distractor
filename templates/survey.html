<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey - AI Code Assistant</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Consolas', 'Menlo', 'Ubuntu Mono', monospace;
            background: linear-gradient(135deg, #1e1e1e, #2d2d30, #3e3e42);
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        .survey-container {
            background: linear-gradient(135deg, #252526, #2d2d30);
            border: 2px solid #404040;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .survey-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f97316, #ea580c, #569cd6, #4a86c7);
            background-size: 200% 100%;
            animation: gradient-shift 3s ease infinite;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Dark scrollbar */
        .survey-container::-webkit-scrollbar {
            width: 8px;
        }

        .survey-container::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 4px;
        }

        .survey-container::-webkit-scrollbar-thumb {
            background: #569cd6;
            border-radius: 4px;
        }

        .survey-container::-webkit-scrollbar-thumb:hover {
            background: #4a86c7;
        }

        .survey-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .survey-header h1 {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #f97316, #ea580c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .survey-header p {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Full quiz flow: Pre → Coding → Post per problem (from server) */
        .quiz-flow-progress {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid #404040;
            border-radius: 10px;
            overflow-x: auto;
        }
        .quiz-flow-progress__inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 6px;
            font-size: 11px;
            line-height: 1.35;
        }
        .quiz-flow-progress__pill {
            padding: 4px 10px;
            border-radius: 999px;
            background: #2d2d30;
            border: 1px solid #404040;
            color: #94a3b8;
            white-space: nowrap;
        }
        .quiz-flow-progress__pill.is-done {
            background: rgba(22, 163, 74, 0.2);
            border-color: #22c55e;
            color: #86efac;
        }
        .quiz-flow-progress__pill.is-active {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            color: #93c5fd;
            font-weight: 600;
        }
        .quiz-flow-progress__sep {
            color: #52525b;
            font-size: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(64, 64, 64, 0.5);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid #404040;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f97316, #ea580c, #569cd6);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        .question {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(64, 64, 64, 0.2);
            border: 1px solid #404040;
            border-radius: 8px;
            border-left: 4px solid #569cd6;
            transition: all 0.3s ease;
        }

        .question:hover {
            background: rgba(64, 64, 64, 0.3);
            border-left-color: #f97316;
        }

        .question.answered {
            border-left-color: #22c55e;
            background: rgba(34, 197, 94, 0.05);
        }

        .question.answered:hover {
            border-left-color: #22c55e;
            background: rgba(34, 197, 94, 0.08);
        }

        .question-label {
            display: block;
            color: #d4d4d4;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .required {
            color: #ef4444;
        }

        /* Help Text */
        .question-help-text {
            color: #888;
            font-size: 11px;
            font-style: italic;
            margin: 8px 0 12px 0;
            padding: 8px 12px;
            background: rgba(64, 64, 64, 0.2);
            border-left: 3px solid #569cd6;
            border-radius: 4px;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        .question.answered .question-help-text {
            border-left-color: #22c55e;
        }

        /* Likert Scale */
        .likert-scale {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .likert-option {
            flex: 1;
            text-align: center;
        }

        .likert-option input[type="radio"] {
            display: none;
        }

        .likert-option label {
            display: block;
            padding: 15px 10px;
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            border: 2px solid #404040;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            color: #cccccc;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .likert-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border-color: #f97316;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        .likert-option label:hover {
            border-color: #569cd6;
            transform: translateY(-2px);
        }

        .likert-option label strong {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .likert-option label small {
            font-size: 10px;
            opacity: 0.8;
        }

        /* Text Input */
        .text-input {
            width: 100%;
            padding: 12px;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #404040;
            border-radius: 8px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.3);
            background: rgba(30, 30, 30, 0.95);
        }

        .text-input::placeholder {
            color: #6c6c6c;
            font-style: italic;
        }

        /* Multiple Choice */
        .multiple-choice {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-option {
            display: flex;
            align-items: center;
            padding: 12px;
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            border: 2px solid #404040;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .choice-option:has(input:checked) {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.1);
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
        }

        .choice-option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
            accent-color: #f97316;
        }

        .choice-option label {
            cursor: pointer;
            flex: 1;
            color: #d4d4d4;
            font-size: 14px;
        }

        .choice-option:hover {
            border-color: #569cd6;
            transform: translateX(5px);
        }

        .choice-option input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
            accent-color: #f97316;
        }

        /* "Other (please specify)": its text box, enabled while the option is chosen */
        .choice-option .other-input {
            flex: 1;
            margin-left: 10px;
            padding: 6px 10px;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #404040;
            border-radius: 6px;
            color: #d4d4d4;
            font-size: 14px;
        }

        .choice-option .other-input:disabled {
            opacity: 0.5;
        }

        /* Matrix: one choice per row */
        .matrix-wrap {
            overflow-x: auto;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            color: #d4d4d4;
        }

        .matrix-table th,
        .matrix-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #404040;
            text-align: center;
        }

        .matrix-table th {
            font-weight: 600;
            color: #aaa;
        }

        .matrix-table th:first-child,
        .matrix-table td:first-child {
            text-align: left;
        }

        .matrix-table tr.row-answered td:first-child {
            color: #22c55e;
        }

        .matrix-table input[type="radio"] {
            cursor: pointer;
            accent-color: #f97316;
            width: 16px;
            height: 16px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        .btn {
            padding: 16px 40px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #ea580c, #dc2626);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #404040;
        }

        .btn-primary:disabled::before {
            display: none;
        }

        .error-message {
            color: #ef4444;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            padding: 15px;
            background: linear-gradient(135deg, #2d1b1b, #3d2222);
            border: 2px solid #ef4444;
            border-radius: 8px;
            white-space: pre-line;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #cccccc;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-radius: 50%;
            border-top-color: #f97316;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        /* Info section at bottom */
        .info-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #404040;
            text-align: center;
        }

        .info-text {
            color: #888;
            font-size: 12px;
            line-height: 1.4;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(34, 197, 94, 0.3);
            margin-top: 10px;
        }

        /* Image Container */
        .question-image-container {
            margin: 15px 0;
            text-align: center;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #404040;
            transition: all 0.3s ease;
            cursor: default;
        }

        .question-image.clickable {
            cursor: pointer;
        }

        .question-image.clickable:hover {
            border-color: #569cd6;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(86, 156, 214, 0.3);
        }

        .question-image.code-background {
            background: #1e1e1e;
            padding: 10px;
        }

        .image-caption {
            display: block;
            margin-top: 8px;
            color: #888;
            font-size: 12px;
            font-style: italic;
        }

        .image-position-above {
            margin-bottom: 15px;
        }

        .image-position-below {
            margin-top: 15px;
        }

        /* Multiple Images Layout */
        .multiple-images {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .multiple-images .question-image {
            max-width: 300px;
        }

        /* Image Loading State */
        .image-loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #404040;
            border-radius: 50%;
            border-top-color: #569cd6;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .image-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            border-radius: 4px;
        }

        /* Survey Header Image */
        .survey-header-image {
            width: 100%;
            max-width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 2px solid #404040;
        }

        /* Image Modal for Zoom */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            overflow: auto;
        }

        .image-modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-modal-content {
            max-width: 95%;
            max-height: 95%;
            margin: auto;
            display: block;
            border: 2px solid #569cd6;
            border-radius: 8px;
            animation: modalZoomIn 0.3s ease-out;
        }

        @keyframes modalZoomIn {
            from { transform: scale(0.8); }
            to { transform: scale(1); }
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10001;
        }

        .image-modal-close:hover {
            color: #f97316;
            transform: scale(1.2);
        }

        /* Character counter for text input */
        .char-counter {
            text-align: right;
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .char-counter.warning {
            color: #f59e0b;
        }

        .char-counter.error {
            color: #ef4444;
        }

        /* ========================================
           NEW QUESTION TYPES STYLES
           ======================================== */

        /* Info Block Question */
        .info-block-question {
            background: rgba(86, 156, 214, 0.1) !important;
            border-left: 4px solid #569cd6 !important;
            padding: 20px;
        }

        .info-block-content {
            color: #d4d4d4;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* 7-point Likert scale with N/A */
        .likert-7-scale {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .likert-7-scale .likert-option {
            flex: 1;
            min-width: 60px;
            max-width: 90px;
        }

        .likert-number {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #569cd6;
        }

        .likert-7-scale .likert-option label {
            min-height: 85px;
            padding: 10px 5px;
        }

        .likert-na-option {
            border-left: 3px solid #f59e0b;
            padding-left: 5px;
            margin-left: 5px;
            background: rgba(245, 158, 11, 0.05);
        }

        .likert-na-option label {
            background: rgba(245, 158, 11, 0.1) !important;
            border-color: #f59e0b !important;
        }

        .likert-na-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            border-color: #f59e0b !important;
        }

        /* Slider styles */
        .slider-container {
            margin: 20px 0;
            padding: 15px;
            background: rgba(64, 64, 64, 0.2);
            border-radius: 8px;
        }

        .slider-value {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #569cd6;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(86, 156, 214, 0.5);
        }

        .slider-input {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(to right, #1e1e1e 0%, #569cd6 50%, #f97316 100%);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #ea580c);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.6);
            transition: all 0.3s ease;
        }

        .slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.8);
        }

        .slider-input::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #ea580c);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.6);
            transition: all 0.3s ease;
        }

        .slider-input::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.8);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .survey-container {
                padding: 25px 20px;
            }

            .survey-header h1 {
                font-size: 22px;
            }

            .likert-scale {
                flex-direction: column;
            }

            .likert-option label {
                padding: 12px;
                min-height: 50px;
            }

            .btn {
                padding: 12px 30px;
                font-size: 14px;
            }

            .multiple-images {
                flex-direction: column;
            }
            
            .multiple-images .question-image {
                max-width: 100%;
            }
            
            .image-modal-close {
                top: 10px;
                right: 20px;
                font-size: 30px;
            }

            .likert-7-scale {
                gap: 5px;
            }
            
            .likert-7-scale .likert-option {
                min-width: 45px;
                max-width: 70px;
            }
            
            .likert-number {
                font-size: 14px;
            }
            
            .likert-7-scale .likert-option label {
                min-height: 75px;
                padding: 8px 3px;
                font-size: 10px;
            }
            
            .slider-value {
                font-size: 24px;
            }
        }
    </style>
    <style>
{% include 'ui_tokens.css' %}
{% include 'pages_theme.css' %}
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="survey-container">
        <div id="quizFlowProgress" class="quiz-flow-progress" style="display:none;" role="navigation" aria-label="Quiz progress"></div>
        <div class="survey-header">
            <h1 id="surveyTitle">Loading Survey...</h1>
            <p id="resumeContextHint" style="display:none; font-size: 13px; color: #94a3b8; margin-top: 6px;"></p>
            <p id="surveyDescription"></p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="surveyContent" class="loading">
            <div class="spinner"></div>
            <p>Loading survey questions...</p>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="button-group" id="buttonGroup" style="display: none;">
            <button class="btn btn-primary" id="submitBtn">Submit Survey</button>
        </div>

        <div class="info-section" style="display: none;" id="infoSection">
            <div class="info-text">
                All questions must be completed to submit the survey. Previous answers are shown when available — you can edit them before submitting. Your responses are securely stored and used for research purposes only.
            </div>
            <div class="security-badge">
                🔒 Secure Research Survey
            </div>
        </div>
    </div>

    <script>
        // Survey Manager - ALL JavaScript INLINE

        function surveyExtensionForLanguage(language) {
            const languageExtensions = {
                'javascript': '.js', 'python': '.py', 'c': '.c', 'cpp': '.cpp',
                'java': '.java', 'csharp': '.cs', 'html': '.html', 'css': '.css', 'sql': '.sql'
            };
            return languageExtensions[language] || '.txt';
        }

        /** image.src: shared file name → /survey-images/… ; quiz upload → quiz_id/filename → /quiz-images/… */
        function surveyImageUrlFromSrc(src) {
            if (!src || typeof src !== 'string') return '';
            const t = src.trim();
            if (t.indexOf('/') !== -1) {
                const i = t.indexOf('/');
                return '/quiz-images/' + encodeURIComponent(t.slice(0, i)) + '/' + t.slice(i + 1).split('/').map(encodeURIComponent).join('/');
            }
            return '/survey-images/' + encodeURIComponent(t);
        }

        function surveySanitizeIdPart(s) {
            const t = String(s || '').replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80);
            return t || 'participant';
        }

        function surveyDownloadTimestampSegment() {
            return new Date().toISOString().replace(/[:.]/g, '-').replace('T', '_');
        }

        function surveyFetchWithTimeout(url, init, timeoutMs) {
            timeoutMs = timeoutMs || 120000;
            if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
                return fetch(url, Object.assign({}, init || {}, { signal: AbortSignal.timeout(timeoutMs) }));
            }
            var ctrl = new AbortController();
            var tid = setTimeout(function () { ctrl.abort(); }, timeoutMs);
            var p = fetch(url, Object.assign({}, init || {}, { signal: ctrl.signal }));
            p.finally(function () { clearTimeout(tid); });
            return p;
        }

        function surveyBuildStemForProblem(userId, assignmentKey, quizId, problemNumber, timestampSeg) {
            const parts = [surveySanitizeIdPart(userId), surveySanitizeIdPart(assignmentKey)];
            if (quizId) {
                let q = surveySanitizeIdPart(String(quizId));
                if (q.length > 24) q = q.slice(0, 24);
                parts.push('q' + q);
            }
            parts.push('p' + String(problemNumber));
            parts.push(timestampSeg);
            return parts.join('_');
        }

        function surveyBuildZipStem(userId, assignmentKey, quizId, timestampSeg) {
            const parts = [surveySanitizeIdPart(userId), surveySanitizeIdPart(assignmentKey)];
            if (quizId) {
                let q = surveySanitizeIdPart(String(quizId));
                if (q.length > 24) q = q.slice(0, 24);
                parts.push('q' + q);
            }
            parts.push(timestampSeg);
            return parts.join('_');
        }
        
        // Navigation control flag to prevent warning during legitimate redirects
        let allowNavigation = false;
        
        // "Other (please specify)": the input value of the option, and the prefix of its answer ("Other: <text>").
        const OTHER_VALUE = '__other__';
        const OTHER_PREFIX = 'Other: ';

        class SurveyManager {
            constructor() {
                this.surveyType = new URLSearchParams(window.location.search).get('type');
                
                // Get auth data from sessionStorage
                const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                this.sessionId = authData.sessionId;
                this.userId = authData.userId;
                this.assignmentKey = authData.assignmentKey;
                // Overwritten in init() from server — stale sessionStorage can point at the wrong problem
                this.problemIndex = authData.currentProblemIndex || 0;

                this.surveyConfig = null;
                this.responses = {};
                this.startTime = Date.now();
                this._surveyDraftSaveTimer = null;
                this._serverSurveyDraftTimer = null;
                
                if (!this.sessionId || !this.userId || !this.assignmentKey) {
                    this.showError('Session expired. Please log in again.');
                    setTimeout(() => window.location.href = '/home.html', 2000);
                    return;
                }
                
                this.init();
            }

            renderQuizFlowProgress(qp) {
                const el = document.getElementById('quizFlowProgress');
                if (!el || !qp || !qp.steps || !qp.steps.length) {
                    if (el) el.style.display = 'none';
                    return;
                }
                const cur = typeof qp.current_step_index === 'number' ? qp.current_step_index : 0;
                const esc = (s) => {
                    if (s == null) return '';
                    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
                };
                let html = '<div class="quiz-flow-progress__inner">';
                for (let idx = 0; idx < qp.steps.length; idx++) {
                    const step = qp.steps[idx];
                    const done = idx < cur;
                    const active = idx === cur;
                    let cls = 'quiz-flow-progress__pill';
                    if (done) cls += ' is-done';
                    if (active) cls += ' is-active';
                    const label = step.short || step.label || ('Step ' + (idx + 1));
                    const tip = step.label || label;
                    html += '<span class="' + cls + '" title="' + esc(tip) + '">' + esc(label) + '</span>';
                    if (idx < qp.steps.length - 1) {
                        html += '<span class="quiz-flow-progress__sep" aria-hidden="true">→</span>';
                    }
                }
                html += '</div>';
                el.innerHTML = html;
                el.style.display = 'block';
            }

            async syncProblemIndexFromServer() {
                if (!this.sessionId) return;
                try {
                    const res = await fetch(
                        '/survey-status/' + encodeURIComponent(this.sessionId) + '?t=' + Date.now(),
                        { cache: 'no-store' }
                    );
                    if (!res.ok) return;
                    const data = await res.json();
                    if (typeof data.current_problem_index === 'number') {
                        this.problemIndex = data.current_problem_index;
                        const ad = JSON.parse(sessionStorage.getItem('authData') || '{}');
                        ad.currentProblemIndex = data.current_problem_index;
                        if (typeof data.total_problems === 'number' && data.total_problems >= 1) {
                            ad.totalProblems = data.total_problems;
                        }
                        sessionStorage.setItem('authData', JSON.stringify(ad));
                    }
                    if (data.quiz_progress && data.quiz_progress.steps && data.quiz_progress.steps.length) {
                        this.renderQuizFlowProgress(data.quiz_progress);
                    }
                } catch (e) {
                    console.warn('syncProblemIndexFromServer:', e);
                }
            }

            async init() {
                try {
                    await this.syncProblemIndexFromServer();
                    await this.loadSurveyConfig();
                    await this.updateSurveyStatus('in_progress');
                    this.renderSurvey();
                    // 1) Server-saved answers (after submit or from last session)
                    await this.applyServerSavedSurveyResponses();
                    // 2) Local draft overrides — in-progress work from this browser
                    this.applySurveyDraftFromStorage();
                    this.setupEventListeners();
                    document.getElementById('infoSection').style.display = 'block';
                } catch (error) {
                    console.error('Survey initialization error:', error);
                    this.showError('Failed to load survey. Please try again.');
                }
            }

            /** localStorage key: one draft per session + survey type + problem index */
            getSurveyDraftStorageKey() {
                return `surveyDraft_${this.sessionId}_${this.surveyType}_p${this.problemIndex}`;
            }

            /** Same map used for localStorage draft and POST /survey-draft */
            buildDraftResponseMap() {
                const out = { ...this.responses };
                if (!this.surveyConfig || !this.surveyConfig.questions) return out;
                for (const q of this.surveyConfig.questions) {
                    if (q.type !== 'open_ended') continue;
                    const wrap = this.findQuestionElement(q.id);
                    const ta = wrap && wrap.querySelector('textarea.text-input');
                    if (ta && ta.value.length) out[q.id] = ta.value;
                }
                return out;
            }

            persistSurveyDraft() {
                if (!this.sessionId || !this.surveyType || !this.surveyConfig) return;
                try {
                    const out = this.buildDraftResponseMap();
                    localStorage.setItem(
                        this.getSurveyDraftStorageKey(),
                        JSON.stringify({ v: 1, savedAt: Date.now(), responses: out })
                    );
                } catch (e) {
                    console.warn('Survey draft save failed:', e);
                }
            }

            schedulePersistSurveyDraft() {
                if (this._surveyDraftSaveTimer) clearTimeout(this._surveyDraftSaveTimer);
                this._surveyDraftSaveTimer = setTimeout(() => {
                    this._surveyDraftSaveTimer = null;
                    this.persistSurveyDraft();
                }, 300);
                this.scheduleServerSurveyDraft();
            }

            scheduleServerSurveyDraft() {
                if (this._serverSurveyDraftTimer) clearTimeout(this._serverSurveyDraftTimer);
                this._serverSurveyDraftTimer = setTimeout(() => {
                    this._serverSurveyDraftTimer = null;
                    this.flushSurveyDraftToServer(false);
                }, 750);
            }

            flushSurveyDraftToServer(keepalive) {
                if (!this.sessionId || !this.userId || !this.surveyType || !this.surveyConfig) return;
                try {
                    const answers = this.buildDraftResponseMap();
                    const body = JSON.stringify({
                        session_id: this.sessionId,
                        user_id: this.userId,
                        survey_type: this.surveyType,
                        problem_index: this.problemIndex,
                        answers: answers
                    });
                    const init = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: body,
                        keepalive: !!keepalive
                    };
                    fetch('/survey-draft', init).catch(function () {});
                } catch (e) {
                    console.warn('Server survey draft save failed:', e);
                }
            }

            clearSurveyDraft() {
                try {
                    localStorage.removeItem(this.getSurveyDraftStorageKey());
                } catch (e) { /* ignore */ }
            }

            /** Resolve question container without fragile CSS escaping on ids */
            findQuestionElement(questionId) {
                const nodes = document.querySelectorAll('#surveyContent [data-question-id]');
                for (const n of nodes) {
                    if (n.getAttribute('data-question-id') === String(questionId)) return n;
                }
                return null;
            }

            /**
             * Apply a question_id -> answer map to the rendered form and this.responses.
             * Used for server rehydration and localStorage drafts (draft applied last wins on overlap).
             */
            applyResponseMapToForm(saved) {
                if (!this.surveyConfig || !this.surveyConfig.questions || !saved || typeof saved !== 'object') return;
                Object.assign(this.responses, saved);

                for (const q of this.surveyConfig.questions) {
                    if (q.type === 'info_block') continue;
                    let val = saved[q.id];
                    if (val === undefined || val === null) {
                        val = saved[String(q.id)];
                    }
                    if (val === undefined || val === null) continue;

                    const el = this.findQuestionElement(q.id);
                    if (!el) continue;

                    const qidStr = String(q.id);
                    if (q.type === 'multiple_choice' && q.allow_other && String(val).startsWith(OTHER_PREFIX)) {
                        this.setOtherChoice(el, String(val).slice(OTHER_PREFIX.length));
                    } else if (q.type === 'likert' || q.type === 'likert_7_with_na' || q.type === 'multiple_choice') {
                        el.querySelectorAll('input[type="radio"]').forEach((radio) => {
                            if (String(radio.name) === qidStr && String(radio.value) === String(val)) radio.checked = true;
                        });
                    } else if (q.type === 'checkboxes' && Array.isArray(val)) {
                        val.forEach((v) => {
                            if (String(v).startsWith(OTHER_PREFIX)) {
                                this.setOtherChoice(el, String(v).slice(OTHER_PREFIX.length));
                                return;
                            }
                            el.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
                                if (cb.value === String(v)) cb.checked = true;
                            });
                        });
                    } else if (q.type === 'matrix' && val && typeof val === 'object') {
                        el.querySelectorAll('input[type="radio"]').forEach((radio) => {
                            if (val[radio.dataset.row] === radio.value) {
                                radio.checked = true;
                                radio.closest('tr').classList.add('row-answered');
                            }
                        });
                    } else if (q.type === 'slider') {
                        const slider = el.querySelector('input[type="range"]');
                        if (slider) {
                            slider.value = String(val);
                            const sliderValue = el.querySelector('.slider-value');
                            const scale = q.scale || { unit: '%' };
                            if (sliderValue) {
                                sliderValue.textContent = `${slider.value}${scale.unit || ''}`;
                            }
                        }
                    } else if (q.type === 'open_ended') {
                        const textarea = el.querySelector('textarea.text-input');
                        const charCounter = el.querySelector('.char-counter');
                        if (textarea) {
                            const s = typeof val === 'string' ? val : String(val);
                            textarea.value = s;
                            // Do NOT dispatch synthetic 'input': the open-ended listener deletes
                            // this.responses[id] when below min_length, clearing merged server/draft data.
                            if (charCounter) {
                                const minLength = q.min_length || 0;
                                const maxLen = q.max_length || 1000;
                                const trimmed = s.trim();
                                charCounter.textContent = `${s.length} / ${maxLen} characters${minLength > 0 ? ` (minimum ${minLength})` : ''}`;
                                if (minLength > 0 && trimmed.length < minLength) {
                                    charCounter.className = 'char-counter warning';
                                } else if (s.length > maxLen * 0.9) {
                                    charCounter.className = 'char-counter warning';
                                } else {
                                    charCounter.className = 'char-counter';
                                }
                            }
                        }
                    }

                    el.classList.toggle('answered', this.isComplete(q, val));
                }

                this.updateProgress();
            }

            async applyServerSavedSurveyResponses() {
                if (!this.sessionId || !this.surveyConfig) return;
                try {
                    const res = await fetch('/survey-status/' + encodeURIComponent(this.sessionId) + '?t=' + Date.now() + '&problem_index=' + encodeURIComponent(String(this.problemIndex)), { cache: 'no-store' });
                    if (!res.ok) return;
                    const data = await res.json();
                    const field = this.surveyType === 'pre' ? 'pre_survey_answers' : 'post_survey_answers';
                    const saved = data[field];
                    if (!saved || typeof saved !== 'object') return;
                    this.applyResponseMapToForm(saved);
                } catch (e) {
                    console.warn('Could not load saved survey answers from server:', e);
                }
            }

            applySurveyDraftFromStorage() {
                if (!this.surveyConfig || !this.surveyConfig.questions) return;
                let raw;
                try {
                    raw = localStorage.getItem(this.getSurveyDraftStorageKey());
                } catch (e) { return; }
                if (!raw) return;
                let data;
                try {
                    data = JSON.parse(raw);
                } catch (e) { return; }
                if (!data || !data.responses || typeof data.responses !== 'object') return;
                this.applyResponseMapToForm(data.responses);
            }

            async loadSurveyConfig() {
                const authData = JSON.parse(sessionStorage.getItem('authData') || '{}');
                // Use this.problemIndex (synced from server in init) as the authoritative value
                const problemIndex = typeof this.problemIndex === 'number' ? this.problemIndex : (authData.currentProblemIndex || 0);
                const response = await fetch(`/survey-config/${this.assignmentKey}?problem_index=${problemIndex}`);
                if (!response.ok) throw new Error('Failed to load survey config');
                
                const config = await response.json();
                
                if (this.surveyType === 'pre') {
                    this.surveyConfig = config.pre_survey;
                } else if (this.surveyType === 'post') {
                    this.surveyConfig = config.post_survey;
                } else {
                    throw new Error('Invalid survey type');
                }

                // Update header - add mandatory message
                document.getElementById('surveyTitle').textContent = this.surveyConfig.title || `${this.surveyType.toUpperCase()} Survey`;
                const descriptionText = this.surveyConfig.description || '';
                document.getElementById('surveyDescription').textContent = descriptionText + (descriptionText ? ' ' : '') + 'All questions are mandatory. You can edit your answers before submitting.';
                const hintEl = document.getElementById('resumeContextHint');
                if (hintEl) {
                    const ad = JSON.parse(sessionStorage.getItem('authData') || '{}');
                    // Use this.problemIndex (synced from server) for the label
                    const pi = (typeof this.problemIndex === 'number' ? this.problemIndex : (ad.currentProblemIndex || 0)) + 1;
                    const tp = ad.totalProblems || 1;
                    const label = this.surveyType === 'pre' ? 'Pre-study' : 'Post-study';
                    hintEl.style.display = 'block';
                    hintEl.textContent = tp > 1
                        ? `${label} · Problem ${pi} of ${tp} — previous answers are shown when available; you can change them before submitting.`
                        : `${label} — previous answers are shown when available; you can change them before submitting.`;
                }
            }

            renderSurvey() {
                const content = document.getElementById('surveyContent');
                content.className = '';
                content.innerHTML = '';

                // Add header image if present
                if (this.surveyConfig.header_image) {
                    const headerImg = document.createElement('img');
                    headerImg.className = 'survey-header-image';
                    headerImg.src = surveyImageUrlFromSrc(this.surveyConfig.header_image.src);
                    headerImg.alt = this.surveyConfig.header_image.alt || 'Survey header';
                    headerImg.onerror = () => {
                        console.error('Header image failed to load');
                        headerImg.remove();
                    };
                    content.appendChild(headerImg);
                }

                // Filter out info_block from question numbering
                let questionNumber = 1;
                this.surveyConfig.questions.forEach((question) => {
                    const questionDiv = this.createQuestionElement(question, questionNumber - 1);
                    content.appendChild(questionDiv);
                    
                    // Only increment for actual questions, not info blocks
                    if (question.type !== 'info_block') {
                        questionNumber++;
                    }
                });

                document.getElementById('buttonGroup').style.display = 'flex';
                document.getElementById('submitBtn').disabled = true;
                this.updateProgress();
            }

            createQuestionElement(question, index) {
                const div = document.createElement('div');
                
                // Handle info_block differently (no numbering)
                if (question.type === 'info_block') {
                    div.className = 'question info-block-question';
                    div.dataset.questionId = question.id;
                    
                    const content = document.createElement('div');
                    content.className = 'info-block-content';
                    content.innerHTML = question.content || '';
                    div.appendChild(content);
                    
                    // Add image if present
                    if (question.image) {
                        div.appendChild(this.createImageElement(question.image, question.id));
                    }
                    
                    return div; // Return early for info blocks
                }
                
                // Regular question handling
                div.className = 'question';
                div.dataset.questionId = question.id;

                const label = document.createElement('label');
                label.className = 'question-label';
                const isRequired = question.required !== false;
                const requiredMark = isRequired ? '<span class="required">*</span>' : '';
                label.innerHTML = `${index + 1}. ${question.question} ${requiredMark}`;
                div.appendChild(label);

                if (question.help_text) {
                    const helpText = document.createElement('div');
                    helpText.className = 'question-help-text';
                    helpText.textContent = question.help_text;
                    div.appendChild(helpText);
                }

                if (question.image) {
                    div.appendChild(this.createImageElement(question.image, question.id));
                } else if (question.images && Array.isArray(question.images)) {
                    div.appendChild(this.createMultipleImagesElement(question.images, question.id));
                }

                // Add question input based on type
                if (question.type === 'likert') {
                    div.appendChild(this.createLikertScale(question));
                } else if (question.type === 'likert_7_with_na') {
                    div.appendChild(this.createLikert7WithNA(question));
                } else if (question.type === 'slider') {
                    div.appendChild(this.createSlider(question));
                } else if (question.type === 'multiple_choice') {
                    div.appendChild(this.createMultipleChoice(question));
                } else if (question.type === 'checkboxes') {
                    div.appendChild(this.createCheckboxes(question));
                } else if (question.type === 'matrix') {
                    div.appendChild(this.createMatrix(question));
                } else if (question.type === 'open_ended') {
                    div.appendChild(this.createOpenEnded(question));
                }

                return div;
            }

            createLikertScale(question) {
                const container = document.createElement('div');
                container.className = 'likert-scale';

                const scale = question.scale || {
                    min: 1,
                    max: 5,
                    minLabel: 'Strongly Disagree',
                    maxLabel: 'Strongly Agree'
                };

                for (let i = scale.min; i <= scale.max; i++) {
                    const option = document.createElement('div');
                    option.className = 'likert-option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = question.id;
                    input.value = i;
                    input.id = `${question.id}_${i}`;
                    input.addEventListener('change', () => this.handleResponse(question.id, i));

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    
                    if (i === scale.min) {
                        label.innerHTML = `<strong>${i}</strong><br><small>${scale.minLabel}</small>`;
                    } else if (i === scale.max) {
                        label.innerHTML = `<strong>${i}</strong><br><small>${scale.maxLabel}</small>`;
                    } else {
                        label.innerHTML = `<strong>${i}</strong>`;
                    }

                    option.appendChild(input);
                    option.appendChild(label);
                    container.appendChild(option);
                }

                return container;
            }

            createLikert7WithNA(question) {
                const container = document.createElement('div');
                container.className = 'likert-scale likert-7-scale';

                const scale = question.scale || {
                    min: 1,
                    max: 7,
                    minLabel: 'Strongly Disagree',
                    maxLabel: 'Strongly Agree'
                };

                // Create 7 regular options
                for (let i = scale.min; i <= scale.max; i++) {
                    const option = document.createElement('div');
                    option.className = 'likert-option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = question.id;
                    input.value = i;
                    input.id = `${question.id}_${i}`;
                    input.addEventListener('change', () => this.handleResponse(question.id, i));

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    
                    if (i === scale.min) {
                        label.innerHTML = `<div class="likert-number">${i}</div><div class="likert-label">${scale.minLabel}</div>`;
                    } else if (i === scale.max) {
                        label.innerHTML = `<div class="likert-number">${i}</div><div class="likert-label">${scale.maxLabel}</div>`;
                    } else {
                        label.innerHTML = `<div class="likert-number">${i}</div>`;
                    }

                    option.appendChild(input);
                    option.appendChild(label);
                    container.appendChild(option);
                }

                // Add N/A option
                const naOption = document.createElement('div');
                naOption.className = 'likert-option likert-na-option';

                const naInput = document.createElement('input');
                naInput.type = 'radio';
                naInput.name = question.id;
                naInput.value = 'N/A';
                naInput.id = `${question.id}_na`;
                naInput.addEventListener('change', () => this.handleResponse(question.id, 'N/A'));

                const naLabel = document.createElement('label');
                naLabel.htmlFor = naInput.id;
                naLabel.innerHTML = `<div class="likert-label" style="font-weight: bold; padding: 10px;">N/A</div>`;

                naOption.appendChild(naInput);
                naOption.appendChild(naLabel);
                container.appendChild(naOption);

                return container;
            }

            createSlider(question) {
                const container = document.createElement('div');
                container.className = 'slider-container';

                const scale = question.scale || {
                    min: 0,
                    max: 100,
                    step: 5,
                    default: 50,
                    unit: '%'
                };

                const sliderValue = document.createElement('div');
                sliderValue.className = 'slider-value';
                sliderValue.textContent = `${scale.default}${scale.unit || ''}`;

                const slider = document.createElement('input');
                slider.type = 'range';
                slider.id = question.id;
                slider.name = question.id;
                slider.min = scale.min;
                slider.max = scale.max;
                slider.step = scale.step || 1;
                slider.value = scale.default || scale.min;
                slider.className = 'slider-input';

                slider.addEventListener('input', (e) => {
                    const value = e.target.value;
                    sliderValue.textContent = `${value}${scale.unit || ''}`;
                    this.handleResponse(question.id, value);
                });

                // Initialize with default value
                this.handleResponse(question.id, slider.value);

                const sliderLabels = document.createElement('div');
                sliderLabels.className = 'slider-labels';
                sliderLabels.innerHTML = `
                    <span>${scale.min}${scale.unit || ''}</span>
                    <span>${scale.max}${scale.unit || ''}</span>
                `;

                container.appendChild(sliderValue);
                container.appendChild(slider);
                container.appendChild(sliderLabels);

                return container;
            }

            createMultipleChoice(question) {
                const container = document.createElement('div');
                container.className = 'multiple-choice';

                question.options.forEach((option, index) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'choice-option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = question.id;
                    input.value = option;
                    input.id = `${question.id}_${index}`;
                    input.addEventListener('change', () => this.handleResponse(question.id, option));

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    label.textContent = option;

                    optionDiv.appendChild(input);
                    optionDiv.appendChild(label);
                    
                    // Make entire div clickable
                    optionDiv.addEventListener('click', (e) => {
                        if (e.target !== input) {
                            input.checked = true;
                            this.handleResponse(question.id, option);
                        }
                    });
                    
                    container.appendChild(optionDiv);
                });

                if (question.allow_other) {
                    container.appendChild(this.createOtherOption(question, 'radio', () => this.readMultipleChoice(question, container)));
                    // Picking a listed option turns the "Other" text box off.
                    container.addEventListener('change', (e) => {
                        if (e.target.type === 'radio' && e.target.value !== OTHER_VALUE) {
                            container.querySelectorAll('.other-input').forEach((t) => { t.disabled = true; });
                        }
                    });
                }

                return container;
            }

            /** "Other (please specify)" with its text box. Answered as OTHER_PREFIX + the text. */
            createOtherOption(question, inputType, onChange) {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'choice-option other-option';

                const input = document.createElement('input');
                input.type = inputType;
                input.name = question.id;
                input.value = OTHER_VALUE;
                input.id = `${question.id}_other`;

                const label = document.createElement('label');
                label.htmlFor = input.id;
                label.style.flex = '0 0 auto';
                label.textContent = (question.other_label || 'Other (please specify)') + ':';

                const text = document.createElement('input');
                text.type = 'text';
                text.className = 'other-input';
                text.maxLength = 200;
                text.placeholder = 'Please specify';
                text.disabled = true;
                text.setAttribute('aria-label', question.other_label || 'Other (please specify)');

                input.addEventListener('change', () => {
                    if (inputType === 'radio') {
                        optionDiv.parentElement.querySelectorAll('.other-input').forEach((t) => { t.disabled = !input.checked; });
                    }
                    text.disabled = !input.checked;
                    if (input.checked) text.focus();
                    onChange();
                });
                text.addEventListener('input', onChange);
                optionDiv.addEventListener('click', (e) => {
                    if (e.target === optionDiv) input.click();
                });

                optionDiv.appendChild(input);
                optionDiv.appendChild(label);
                optionDiv.appendChild(text);
                return optionDiv;
            }

            /** Check the "Other" option of a rendered question and fill in its text (rehydration). */
            setOtherChoice(el, text) {
                const input = el.querySelector(`input[value="${OTHER_VALUE}"]`);
                const box = el.querySelector('.other-input');
                if (!input || !box) return;
                input.checked = true;
                box.disabled = false;
                box.value = text;
            }

            readMultipleChoice(question, container) {
                const checked = container.querySelector('input[type="radio"]:checked');
                if (!checked) return;
                if (checked.value === OTHER_VALUE) {
                    this.handleResponse(question.id, OTHER_PREFIX + container.querySelector('.other-input').value);
                } else {
                    container.querySelectorAll('.other-input').forEach((t) => { t.disabled = true; });
                    this.handleResponse(question.id, checked.value);
                }
            }

            /** Select all that apply: answered as the list of checked options. */
            createCheckboxes(question) {
                const container = document.createElement('div');
                container.className = 'multiple-choice';
                const read = () => {
                    const picked = [];
                    container.querySelectorAll('input[type="checkbox"]:checked').forEach((cb) => {
                        picked.push(cb.value === OTHER_VALUE ? OTHER_PREFIX + container.querySelector('.other-input').value : cb.value);
                    });
                    if (picked.length) {
                        this.handleResponse(question.id, picked);
                    } else {
                        delete this.responses[question.id];
                        const el = this.findQuestionElement(question.id);
                        if (el) el.classList.remove('answered');
                        this.updateProgress();
                        this.schedulePersistSurveyDraft();
                    }
                };

                (question.options || []).forEach((option, index) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'choice-option';

                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.name = question.id;
                    input.value = option;
                    input.id = `${question.id}_${index}`;
                    input.addEventListener('change', read);

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    label.textContent = option;

                    optionDiv.appendChild(input);
                    optionDiv.appendChild(label);
                    optionDiv.addEventListener('click', (e) => {
                        if (e.target === optionDiv) input.click();
                    });
                    container.appendChild(optionDiv);
                });

                if (question.allow_other) {
                    container.appendChild(this.createOtherOption(question, 'checkbox', read));
                }
                return container;
            }

            /** One choice (question.options) per row (question.rows): answered as {row: option}. */
            createMatrix(question) {
                const wrap = document.createElement('div');
                wrap.className = 'matrix-wrap';
                const table = document.createElement('table');
                table.className = 'matrix-table';

                const head = document.createElement('tr');
                const corner = document.createElement('th');
                corner.textContent = question.row_header || '';
                head.appendChild(corner);
                (question.options || []).forEach((option) => {
                    const th = document.createElement('th');
                    th.scope = 'col';
                    th.textContent = option;
                    head.appendChild(th);
                });
                const thead = document.createElement('thead');
                thead.appendChild(head);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                (question.rows || []).forEach((row, ri) => {
                    const tr = document.createElement('tr');
                    const th = document.createElement('td');
                    th.textContent = row;
                    tr.appendChild(th);
                    (question.options || []).forEach((option, oi) => {
                        const td = document.createElement('td');
                        const input = document.createElement('input');
                        input.type = 'radio';
                        input.name = `${question.id}__r${ri}`;
                        input.value = option;
                        input.dataset.row = row;
                        input.setAttribute('aria-label', `${row}: ${option}`);
                        input.addEventListener('change', () => {
                            tr.classList.add('row-answered');
                            const prev = this.responses[question.id];
                            const answer = prev && typeof prev === 'object' && !Array.isArray(prev) ? { ...prev } : {};
                            answer[row] = option;
                            this.handleResponse(question.id, answer);
                        });
                        td.appendChild(input);
                        td.addEventListener('click', (e) => {
                            if (e.target === td) input.click();
                        });
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                wrap.appendChild(table);
                return wrap;
            }

            createOpenEnded(question) {
                const container = document.createElement('div');
                
                const textarea = document.createElement('textarea');
                textarea.className = 'text-input';
                textarea.placeholder = question.placeholder || 'Enter your response here...';
                textarea.maxLength = question.max_length || 1000;
                
                const charCounter = document.createElement('div');
                charCounter.className = 'char-counter';
                const minLength = question.min_length || 0;
                charCounter.textContent = `0 / ${question.max_length || 1000} characters${minLength > 0 ? ` (minimum ${minLength})` : ''}`;
                
                textarea.addEventListener('input', (e) => {
                    const value = e.target.value;
                    const trimmedValue = value.trim();
                    const currentLength = value.length;
                    
                    // Update character counter
                    charCounter.textContent = `${currentLength} / ${question.max_length || 1000} characters${minLength > 0 ? ` (minimum ${minLength})` : ''}`;
                    
                    // Color coding for character counter
                    if (minLength > 0 && trimmedValue.length < minLength) {
                        charCounter.className = 'char-counter warning';
                    } else if (currentLength > (question.max_length || 1000) * 0.9) {
                        charCounter.className = 'char-counter warning';
                    } else {
                        charCounter.className = 'char-counter';
                    }
                    
                    // Validate minimum length (only for real typing — not synthetic events)
                    if (trimmedValue.length >= minLength) {
                        this.handleResponse(question.id, value);
                    } else if (e.isTrusted) {
                        delete this.responses[question.id];
                        this.updateProgress();
                        this.schedulePersistSurveyDraft();
                    }
                });
                
                container.appendChild(textarea);
                container.appendChild(charCounter);
                
                return container;
            }

            createImageElement(imageConfig, questionId) {
                const container = document.createElement('div');
                container.className = `question-image-container image-position-${imageConfig.position || 'above'}`;

                const img = document.createElement('img');
                img.className = 'question-image';
                img.alt = imageConfig.alt || 'Survey question image';
                img.loading = 'eager';
                
                if (imageConfig.width) {
                    img.style.width = imageConfig.width;
                }
                if (imageConfig.max_width) {
                    img.style.maxWidth = imageConfig.max_width;
                }
                if (imageConfig.background) {
                    img.classList.add('code-background');
                    img.style.background = imageConfig.background;
                }
                if (imageConfig.padding) {
                    img.style.padding = imageConfig.padding;
                }
                
                const imageSrc = surveyImageUrlFromSrc(imageConfig.src);
                console.log(`🖼️ Loading: ${imageSrc}`);
                
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'image-loading';
                container.appendChild(loadingDiv);
                
                img.onload = () => {
                    console.log(`✅ Loaded: ${imageConfig.src}`);
                    loadingDiv.remove();
                    container.appendChild(img);
                    
                    if (imageConfig.caption) {
                        const caption = document.createElement('span');
                        caption.className = 'image-caption';
                        caption.textContent = imageConfig.caption;
                        container.appendChild(caption);
                    }
                };
                
                img.onerror = (e) => {
                    console.error(`❌ Failed: ${imageConfig.src}`);
                    loadingDiv.remove();
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'image-error';
                    errorDiv.textContent = `⚠️ Failed to load: ${imageConfig.src}`;
                    container.appendChild(errorDiv);
                };
                
                img.src = imageSrc;
                
                if (imageConfig.zoom || imageConfig.clickable) {
                    img.classList.add('clickable');
                    img.onclick = () => this.openImageModal(img.src, imageConfig.alt);
                }

                return container;
            }

            createMultipleImagesElement(images, questionId) {
                const container = document.createElement('div');
                container.className = 'question-image-container multiple-images';

                images.forEach((imageConfig, index) => {
                    const imgWrapper = document.createElement('div');
                    
                    const img = document.createElement('img');
                    img.className = 'question-image';
                    img.alt = imageConfig.alt || `Image ${index + 1}`;
                    img.src = surveyImageUrlFromSrc(imageConfig.src);
                    img.loading = 'lazy';
                    
                    if (imageConfig.width) img.style.width = imageConfig.width;
                    
                    img.onerror = () => {
                        img.style.display = 'none';
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'image-error';
                        errorDiv.textContent = `Failed to load: ${imageConfig.src}`;
                        imgWrapper.appendChild(errorDiv);
                    };
                    
                    if (imageConfig.zoom || imageConfig.clickable) {
                        img.classList.add('clickable');
                        img.onclick = () => this.openImageModal(img.src, imageConfig.alt);
                    }
                    
                    imgWrapper.appendChild(img);
                    
                    if (imageConfig.caption) {
                        const caption = document.createElement('span');
                        caption.className = 'image-caption';
                        caption.textContent = imageConfig.caption;
                        imgWrapper.appendChild(caption);
                    }
                    
                    container.appendChild(imgWrapper);
                });

                return container;
            }

            openImageModal(src, alt) {
                let modal = document.getElementById('imageModal');
                if (!modal) {
                    modal = document.createElement('div');
                    modal.id = 'imageModal';
                    modal.className = 'image-modal';
                    modal.innerHTML = `
                        <span class="image-modal-close">&times;</span>
                        <img class="image-modal-content" id="modalImage" alt="">
                    `;
                    document.body.appendChild(modal);
                    
                    modal.querySelector('.image-modal-close').onclick = () => {
                        modal.classList.remove('active');
                    };
                    modal.onclick = (e) => {
                        if (e.target === modal) {
                            modal.classList.remove('active');
                        }
                    };
                    
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape' && modal.classList.contains('active')) {
                            modal.classList.remove('active');
                        }
                    });
                }
                
                const modalImg = document.getElementById('modalImage');
                modalImg.src = src;
                modalImg.alt = alt;
                modal.classList.add('active');
            }

            /** Resolve stored answer for a question (IDs may be number in config, string in API/localStorage). */
            getAnswerForQuestion(q) {
                if (!q) return undefined;
                let v = this.responses[q.id];
                if (v !== undefined && v !== null) return v;
                v = this.responses[String(q.id)];
                return v !== undefined && v !== null ? v : undefined;
            }

            handleResponse(questionId, answer) {
                this.responses[questionId] = answer;
                
                // Add visual feedback - mark question as answered
                const questionElement = this.findQuestionElement(questionId);
                if (questionElement) {
                    const q = (this.surveyConfig.questions || []).find((x) => String(x.id) === String(questionId));
                    questionElement.classList.toggle('answered', this.isComplete(q, answer));
                }
                
                this.updateProgress();
                this.schedulePersistSurveyDraft();
            }

            /** Whether answer `v` fully answers question `q` ("Other" needs its text, a matrix every row). */
            isComplete(q, v) {
                if (v === undefined || v === null) return false;
                const otherOk = (x) => !String(x).startsWith(OTHER_PREFIX) || String(x).slice(OTHER_PREFIX.length).trim() !== '';
                if (q && q.type === 'matrix') {
                    return typeof v === 'object' && (q.rows || []).every((row) => v[row] !== undefined && v[row] !== null);
                }
                if (Array.isArray(v)) return v.length > 0 && v.every(otherOk);
                if (typeof v === 'string') return v.trim() !== '' && (!(q && q.allow_other) || otherOk(v));
                return true;
            }

            updateProgress() {
                // Exclude info_block from total count
                const totalQuestions = this.surveyConfig.questions.filter(q => q.type !== 'info_block').length;
                const answeredQuestions = this.surveyConfig.questions.filter(q => {
                    if (q.type === 'info_block') return false;
                    return this.isComplete(q, this.getAnswerForQuestion(q));
                }).length;
                const progress = totalQuestions ? (answeredQuestions / totalQuestions) * 100 : 0;

                document.getElementById('progressFill').style.width = `${progress}%`;

                const submitBtn = document.getElementById('submitBtn');
                if (submitBtn) {
                    // Only required questions block submission
                    const requiredQuestions = this.surveyConfig.questions.filter(q => q.type !== 'info_block' && q.required !== false);
                    const answeredRequired = requiredQuestions.filter(q => this.isComplete(q, this.getAnswerForQuestion(q))).length;
                    submitBtn.disabled = answeredRequired < requiredQuestions.length;
                }
            }

            async updateSurveyStatus(status) {
                try {
                    const response = await fetch(`/update-survey-status?session_id=${this.sessionId}&survey_type=${this.surveyType}&status=${status}`, {
                        method: 'POST'
                    });
                    if (!response.ok) throw new Error('Failed to update status');
                } catch (error) {
                    console.error('Status update error:', error);
                }
            }

            setupEventListeners() {
                document.getElementById('submitBtn').addEventListener('click', () => this.submitSurvey());

                // Flush draft synchronously when leaving (IDE, back button, refresh) — debounced save may not have run.
                window.addEventListener('pagehide', () => {
                    try {
                        this.persistSurveyDraft();
                        this.flushSurveyDraftToServer(true);
