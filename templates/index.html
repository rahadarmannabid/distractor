<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monaco Editor Example</title>
    <style>
        /* Flex Container */
        * {
            /* Helps viewport width & height */
            margin: 0px;
        }
        #container {
            display: flex;
            width: 100vw;
        }
        #content {
            /* Child of #container flex-box */
            flex:1;
            min-width: 0;
            /* Self flex-box */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #editor {
            min-height: 0;
            flex:1;
        }
        #terminal {
            height: 20vh;
        }
        #sidebar {
            width: 20vw;
        }
        /* Resizing */
        #resize-sidebar {
            width: 5px;
            background-color: darkgray;
            cursor: ew-resize;
        }
        #resize-terminal {
            height: 5px;
            background-color: darkgray;
            cursor: ns-resize;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="content">
            <div id="header">
                <h2>✏️ Code Editor</h2>
            </div>
            <div id="editor"></div>
            <div id="resize-terminal"></div>
            <div id="terminal">
                <h2>JavaScript Terminal</h2>
            </div>
        </div>

        <div id="resize-sidebar"></div>
        <div id="sidebar">
            <h2>Problem Description</h2>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs/loader.min.js"></script>
    <script>
        // INITIALIZE MONACO
        require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs" }});
        require(["vs/editor/editor.main"], function () {
            monaco.editor.create(document.getElementById("editor"), {
                value: "// Write JavaScript here\nconsole.log('Hello World');",
                language: "javascript",
                theme: "vs-dark",
                automaticLayout: true,
            });
        });

        // RESIZE HANDLING
        const resize = {};
        resize.sidebar = false;
        resize.terminal = false;
        
        document.getElementById('resize-sidebar').addEventListener('mousedown', (e) => {
            resize.sidebar = true;
            document.addEventListener('mousemove', handleSidebarResize);
            document.addEventListener('mouseup', handleMouseUp);
        })

        document.getElementById('resize-terminal').addEventListener('mousedown', (e) => {
            resize.terminal = true;
            document.addEventListener('mousemove', handleTerminalResize);
            document.addEventListener('mouseup', handleMouseUp);
        })

        function handleSidebarResize(e) {
            if (!resize.sidebar) return;
            document.getElementById('sidebar').style.width = `${window.innerWidth - e.clientX}px`;
        }

        function handleTerminalResize(e) {
            if (!resize.terminal) return;
            document.getElementById('terminal').style.height = `${window.innerHeight - e.clientY}px`;
        }

        function handleMouseUp() {
            resize.sidebar = false;
            resize.terminal = false;
            document.removeEventListener('mouseup', handleMouseUp);
        }
    </script>
</body>
</html>
